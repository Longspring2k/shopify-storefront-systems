<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collection state demo</title><link rel="stylesheet" href="/styles.css"></head><body>
<header><p class="eyebrow">Synthetic storefront systems demo</p><h1>Everyday collection</h1><p>Draft filters apply together; the URL owns committed state.</p></header>
<main><aside><form id="filters"><div class="actions"><strong>Filters</strong><button type="button" id="cancel">Cancel draft</button></div>
<fieldset><legend>Color</legend><label><input type="checkbox" name="color" value="black">Black</label><label><input type="checkbox" name="color" value="blue">Blue</label><label><input type="checkbox" name="color" value="green">Green</label><label><input type="checkbox" name="color" value="navy">Navy</label><label><input type="checkbox" name="color" value="red">Red</label><label><input type="checkbox" name="color" value="white">White</label></fieldset>
<fieldset><legend>Size</legend><label><input type="checkbox" name="size" value="s">S</label><label><input type="checkbox" name="size" value="m">M</label><label><input type="checkbox" name="size" value="l">L</label><label><input type="checkbox" name="size" value="xl">XL</label></fieldset>
<p id="pending" class="pending" role="status" hidden></p><button class="primary" type="submit">Apply filters and sort</button></form></aside>
<section><div class="toolbar"><label>Sort <select id="sort"><option value="featured">Featured</option><option value="price-asc">Price, low to high</option><option value="price-desc">Price, high to low</option><option value="name-asc">Name</option></select></label><button id="clear">Clear filters</button></div><div id="chips" aria-label="Active filters"></div><p id="status" role="status" aria-live="polite"></p><div id="grid" class="grid"></div><nav id="pages" aria-label="Pagination"></nav></section></main>
<script type="module" src="/app.mjs"></script></body></html>
